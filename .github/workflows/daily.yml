name: Daily Report

on:
  schedule:
    - cron: '0 16 * * *'  # 16:00 UTC = 00:00 Asia/Taipei
  workflow_dispatch:      # 手動觸發

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          TZ: Asia/Taipei
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          REPORT_DATE=$(date +%Y-%m-%d)
          echo "Report date (Asia/Taipei): ${REPORT_DATE}"
          echo "REPORT_DATE=${REPORT_DATE}" >> "$GITHUB_ENV"
          python flow_run.py --date "${REPORT_DATE}"
          python run.py --date "${REPORT_DATE}" --skip-hmm --force-refresh
          python global_regime.py --force-refresh --date "${REPORT_DATE}"
          python -m src.news_retrieval --date "${REPORT_DATE}"
          python synthesis.py --date "${REPORT_DATE}"
          python layer_pages.py --date "${REPORT_DATE}"

      - name: Commit report
        env:
          TZ: Asia/Taipei
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/synthesis_lite.html data/raw/ data/processed/news_*.json || true
          git diff --staged --quiet || git commit -m "Daily report ${REPORT_DATE}"

      - name: Push report
        run: git push
